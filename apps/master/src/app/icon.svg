<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo Arredondado PWA Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Cúpula / Brasão Parlamentar Estilizado (Gabinete 360) -->
  <g filter="url(#shadow)" transform="translate(0, 8)">
    <!-- Órbita 360 Graus Circular -->
    <circle cx="256" cy="256" r="172" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-dasharray="16 12" />
    
    <!-- Arco 360 de Destaque -->
    <path d="M 120 340 A 164 164 0 1 1 392 340" fill="none" stroke="url(#arcGrad)" stroke-width="22" stroke-linecap="round" />

    <!-- Colunas e Cúpula do Parlamento / Poder Legislativo -->
    <!-- Cúpula Superior -->
    <path d="M 180 200 C 180 145, 332 145, 332 200 Z" fill="#38bdf8" />
    
    <!-- Linha do Entablamento -->
    <rect x="170" y="206" width="172" height="12" rx="4" fill="#f8fafc" />
    
    <!-- 4 Colunas Clássicas -->
    <rect x="186" y="226" width="16" height="74" rx="3" fill="#e2e8f0" />
    <rect x="228" y="226" width="16" height="74" rx="3" fill="#f8fafc" />
    <rect x="268" y="226" width="16" height="74" rx="3" fill="#f8fafc" />
    <rect x="310" y="226" width="16" height="74" rx="3" fill="#e2e8f0" />
    
    <!-- Base / Estilóbato -->
    <rect x="160" y="306" width="192" height="14" rx="5" fill="#f8fafc" />
    <rect x="146" y="324" width="220" height="16" rx="6" fill="#38bdf8" />

    <!-- Ponto de Foco Orbital 360° -->
    <circle cx="392" cy="340" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  </g>
</svg>
